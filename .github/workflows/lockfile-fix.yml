name: Lockfile security fix

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.3
          cache: npm
      - name: Use the declared npm version
        run: npm install --global npm@11.14.1
      - name: Pin the patched transitive dependency
        run: |
          npm pkg set overrides.nanoid=3.3.17
          npm install --package-lock-only --ignore-scripts
      - name: Verify audits
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high
      - name: Upload corrected package metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: patched-package-metadata
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1
