name: Lockfile security fix

on:
  push:
    branches:
      - site/webchess-public-launch
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.3
          cache: npm
      - name: Use the declared npm version
        run: npm install --global npm@11.14.1
      - name: Pin the patched transitive dependency
        run: |
          npm pkg set overrides.nanoid=3.3.17
          npm install --package-lock-only --ignore-scripts
      - name: Verify audits
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high
      - name: Commit corrected package metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Pin patched nanoid transitive dependency"
          git push origin "HEAD:${GITHUB_REF_NAME}"
