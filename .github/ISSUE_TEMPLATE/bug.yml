name: Reproducible bug
description: Report a bounded defect with enough detail to reproduce it.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, access codes, session secrets, private prompts, or personal data.
  - type: textarea
    id: outcome
    attributes:
      label: Expected and actual outcome
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include exact steps, configuration with secrets removed, and a minimal question if relevant.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision or version
      placeholder: Commit SHA or release
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, browser, provider mode, and model identifier.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Non-sensitive evidence
      description: Logs, screenshots, or test output with credentials and private data removed.
