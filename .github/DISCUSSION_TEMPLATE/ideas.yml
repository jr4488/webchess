title: "[Idea] "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Explain the smallest useful implementation.
    validations:
      required: true
  - type: textarea
    id: evaluation
    attributes:
      label: How would we know it helped?
      description: Name observable outcomes, failure modes, and tradeoffs.
