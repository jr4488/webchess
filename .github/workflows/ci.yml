name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ''
    strategy:
      fail-fast: false
      matrix:
        node:
          - 20.19.x
          - 22.x
          - 24.x

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Use the declared npm version
        run: npm install --global npm@11.14.1

      - name: Install locked dependencies
        run: npm ci

      - name: Verify
        run: npm run verify
