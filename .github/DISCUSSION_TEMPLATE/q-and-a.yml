title: "[Question] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Ask for installation or usage help here. Never post credentials, cookies, environment files, private game questions, generated personal data, or other personal information.
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
      description: Include version, environment, and non-sensitive output.
    validations:
      required: true
