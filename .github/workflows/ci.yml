name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ''
      CODEX_API_KEY: ''
      CODEX_ACCESS_TOKEN: ''
      WEBCHESS_REQUIRE_BWRAP_INTEGRATION: '1'
      WEBCHESS_MODEL_PROVIDER: openai-api
    strategy:
      fail-fast: false
      matrix:
        node:
          - 20.19.0
          - 22.13.0
          - 24.0.0

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Use the declared npm version
        run: npm install --global npm@11.14.1

      - name: Install sandbox test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bubblewrap ca-certificates gcc libc6-dev

      - name: Install locked dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Audit the full dependency tree
        run: npm audit --audit-level=high
